    ['SAN-A 浦添西海岸 PARCO CITY', 26.2555,127.7085,'14:00 臨海購物・商場 10:00–22:00','サンエー浦添西海岸 PARCO CITY'],
    ['炭火焼肉ぷち 久茂地本店', 26.2150,127.6795,'20:20 已訂位・2 位・LI YINGHUEI','炭火焼肉ぷち 久茂地本店','food'],
  ]},
  { label:'D4 11/20', pts:[
    ['maejima Hotel', 26.2214,127.6800,'10:00 退房・寄放行李','maejima Hotel 那覇前島ホテル','stay'],
    ['波上宮', 26.2216,127.6714,'10:30 參拜・御朱印 9:00–16:45','波上宮'],
    ['壺屋やちむん通', 26.2128,127.6911,'13:00 石板路陶器街','壺屋やちむん通り'],
    ['那霸機場', 26.2058,127.6466,'15:30 退稅確認・最後採購・返台','那覇空港'],
  ]},
];
const FOOD = [];
DAYS.forEach((d,i)=>d.pts.forEach(p=>{ if(p[5]==='food') FOOD.push([...p, i+1]); }));

const map = L.map('map',{zoomControl:false,attributionControl:true}).setView([26.2125,127.6809],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap contributors', maxZoom:18
}).addTo(map);

let layer = L.layerGroup().addTo(map);
let mode='day', day=1;
function readHash(){ const m=/d(\d)/.exec(location.hash); if(m){ day=Math.min(6,Math.max(1,+m[1])); } }
readHash();
window.addEventListener('hashchange',()=>{ readHash(); mode='day'; sync(); });

const daysEl = document.getElementById('days');
DAYS.forEach((d,i)=>{
  const el=document.createElement('div');
  el.className='day'+(i===1?'':''); el.textContent=d.label; el.dataset.i=i+1;
  el.onclick=()=>{ day=i+1; mode='day'; sync(); };
  daysEl.appendChild(el);
});

function icon(kind,label){
  return L.divIcon({html:'<div class="pin '+(kind||'')+'">'+label+'</div>',className:'',iconSize:[24,24],iconAnchor:[12,12]});
}
function sheet(p,badge){
  document.getElementById('sk').textContent=badge;
  document.getElementById('sn').textContent=p[0];
  document.getElementById('sm').textContent=p[3];
  document.getElementById('sa').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p[4]||p[0]);
  document.getElementById('sheet').classList.add('on');
}
document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('on');

function sync(){
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.mode===mode));
  document.querySelectorAll('.day').forEach(c=>c.classList.toggle('on',mode==='day'&&+c.dataset.i===day));
  daysEl.style.display = mode==='day' ? 'flex' : 'none';
  layer.clearLayers();
  document.getElementById('sheet').classList.remove('on');
  let pts=[];
  if(mode==='day'){
    const d=DAYS[day-1]; pts=d.pts;
    L.polyline(pts.map(p=>[p[1],p[2]]),{color:'#2D5A45',weight:2,opacity:.55,dashArray:'5 6'}).addTo(layer);
    pts.forEach((p,i)=>L.marker([p[1],p[2]],{icon:icon(p[5],i+1)}).addTo(layer)
      .on('click',()=>sheet(p, d.label+' · 第'+(i+1)+'站')));
  } else if(mode==='all'){
    DAYS.forEach((d,di)=>d.pts.forEach(p=>{ pts.push(p);
      L.marker([p[1],p[2]],{icon:icon(p[5],di+1)}).addTo(layer).on('click',()=>sheet(p,d.label));
    }));
  } else {
    FOOD.forEach(p=>{ pts.push(p);
      L.marker([p[1],p[2]],{icon:icon('food',p[6])}).addTo(layer).on('click',()=>sheet(p,'D'+p[6]+' 美食'));
    });
  }
  if(pts.length<2){ map.setView(pts.length?[pts[0][1],pts[0][2]]:[26.2125,127.6809],14); return; }
  const b=L.latLngBounds(pts.map(p=>[p[1],p[2]]));
  map.fitBounds(b,{paddingTopLeft:[36,110],paddingBottomRight:[36,110],maxZoom:15});
}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ mode=c.dataset.mode; sync(); });
sync();
</script>
